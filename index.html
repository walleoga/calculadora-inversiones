<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Inversión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Simulador de Inversión</h2>
    
    <label for="monthly">Aporte Mensual (USD):</label>
    <input type="number" id="monthly" value="1000" min="1">

    <label for="rate">Rendimiento Anual Estimado (%):</label>
    <div class="preset-buttons">
      <button type="button" class="btn-preset" onclick="setRate(8)">S&P 500 (8%)</button>
      <button type="button" class="btn-preset" onclick="setRate(12)">QQQ (12%)</button>
    </div>
    <input type="number" id="rate" value="8" step="0.5">

    <label for="years">Años a Invertir:</label>
    <input type="number" id="years" value="5" min="1" max="50">

    <button type="button" class="btn-calc" onclick="calcular()">Calcular Retorno</button>

    <div class="result-box">
      <p>Capital aportado: <span id="out-capital">$0 USD</span></p>
      <p>Ganancia por intereses: <span id="out-ganancia" class="profit">$0 USD</span></p>
      <hr>
      <p class="total">Total final: <span id="out-total">$0 USD</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
