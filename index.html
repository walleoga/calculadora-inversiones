<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Inversión Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Simulador de Inversión</h2>
      
      <!-- Capital Inicial -->
      <div class="input-group">
        <label for="initial">Capital Inicial (USD): <span id="val-initial" class="badge">$0</span></label>
        <input type="range" id="initial" min="0" max="50000" step="500" value="0" oninput="actualizar()">
      </div>

      <div class="input-group">
        <label for="monthly">Aporte Mensual (USD): <span id="val-monthly" class="badge">$1,000</span></label>
        <input type="range" id="monthly" min="50" max="10000" step="50" value="1000" oninput="actualizar()">
      </div>

      <div class="input-group">
        <label>Rendimiento Anual Estimado (%):</label>
        <div class="preset-buttons">
          <button type="button" class="btn-preset active" id="btn-sp" onclick="setPreset(8, this)">S&P 500 (8%)</button>
          <button type="button" class="btn-preset" id="btn-qqq" onclick="setPreset(12, this)">QQQ (12%)</button>
        </div>
        <input type="range" id="rate" min="1" max="25" step="0.5" value="8" oninput="syncRateSlider()">
        <div class="rate-indicator"><span id="val-rate">8%</span> anual</div>
      </div>

      <div class="input-group">
        <label for="years">Años a Invertir: <span id="val-years" class="badge">5 años</span></label>
        <input type="range" id="years" min="1" max="35" step="1" value="5" oninput="actualizar()">
      </div>

      <div class="result-box">
        <div class="stat">
          <span class="stat-label">Capital Aportado:</span>
          <span id="out-capital" class="stat-val">$0 USD</span>
        </div>
        <div class="stat">
          <span class="stat-label">Ganancia por Intereses:</span>
          <span id="out-ganancia" class="stat-val profit">+$0 USD</span>
        </div>
        <hr>
        <div class="stat total-row">
          <span class="stat-label">Total Acumulado:</span>
          <span id="out-total" class="stat-val total">$0 USD</span>
        </div>
      </div>

      <div class="chart-wrapper">
        <canvas id="growthChart"></canvas>
      </div>

      <details class="table-accordion">
        <summary>Ver desglose año por año</summary>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Año</th>
                <th>Capital Aportado</th>
                <th>Interés Ganado</th>
                <th>Total Acumulado</th>
              </tr>
            </thead>
            <tbody id="breakdown-body">
            </tbody>
          </table>
        </div>
      </details>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
